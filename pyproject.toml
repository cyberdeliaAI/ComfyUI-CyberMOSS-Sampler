[project]
name = "cybermoss-sampler"
version = "0.1.1"
description = "A preset-driven MOSS-Image sampler and 128-channel empty latent node for ComfyUI, with Turbo and full-model presets, constant CFG, negative-branch layer skipping and direct manual tuning."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/cyberdeliaAI/ComfyUI-CyberMOSS-Sampler"
Homepage = "https://www.cyberdelia.nl"
"Bug Tracker" = "https://github.com/cyberdeliaAI/ComfyUI-CyberMOSS-Sampler/issues"

[tool.comfy]
PublisherId = "cyberdelia"
DisplayName = "CyberMOSS Sampler"
Icon = "https://raw.githubusercontent.com/cyberdeliaAI/ComfyUI-CyberMOSS-Sampler/main/assets/icon.png"
